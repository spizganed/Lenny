[package]
name = "lenny_desktop"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
description = "Lenny Desktop: receives the phone's stream, shows it, and feeds the OS virtual camera."
license = "UNLICENSED"
publish = false

[[bin]]
name = "lenny-desktop"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["wayland", "x11", "default_fonts", "accesskit", "persistence"] }
env_logger = "0.11.11"
if-addrs = "0.15.0"
lenny_core = { path = "../core" }
lenny_vcam = { path = "../vcam" }
log = "0.4.34"
openh264 = "0.9.8"
png = "0.18.1"
qrcode = { version = "0.14.1", default-features = false }

# Renderer. Windows: wgpu on DirectX 12. OpenGL there (NVIDIA) cost 3x the UI thread's CPU in the driver's buffer swap,
# which made the app feel laggy.
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["wgpu"] }
wgpu = { version = "25.0.2", default-features = false, features = ["dx12", "wgsl"] } # eframe enables no wgpu backend
# Close while minimized (main.rs): same versions eframe already pulls in.
winit = { version = "0.30.13", default-features = false }
windows-sys = { version = "0.52.0", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

# Linux: OpenGL (runs on Mesa's software renderer too, which the Xvfb screenshot runs use).
[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["glow"] }
