name: lenny
description: "Use your phone as a webcam"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  ffi: ^2.2.0
  android_camera:
    path: ../plugins/android_camera
  windows_receiver:
    path: ../plugins/windows_receiver
  shared_preferences: ^2.5.5
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ffigen: ^21.0.0

flutter:
  uses-material-design: true
